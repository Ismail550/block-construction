  <style>
    :root{
      --black:#111111;
      --yellow:#f2c400;
      --white:#ffffff;
      --gray:#f4f4f1;
      --text:#222222;
      --muted:#6f6f6f;
      --line:#dedede;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:var(--white);
      line-height:1.6;
    }
    a{text-decoration:none;color:inherit}
    .container{width:min(1180px,92%);margin:auto}

    header{
      position:sticky;top:0;z-index:10;
      background:rgba(17,17,17,.94);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    .nav{
      height:82px;
      display:flex;align-items:center;justify-content:space-between;gap:30px;
    }
    .logo{
      display:flex;align-items:center;
      background:#fff;
      padding:7px 12px;
      border-radius:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      transition:.25s ease;
    }
    .logo:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 28px rgba(0,0,0,.24);
    }
    .logo img{
      display:block;
      width:172px;
      height:auto;
      border-radius:12px;
    }
    .menu{display:flex;align-items:center;gap:26px;color:#fff;font-size:14px;font-weight:700}
    .menu a{position:relative;transition:.2s ease}
    .menu > a:not(.cta):after{
      content:"";
      position:absolute;left:0;bottom:-8px;width:0;height:2px;
      background:var(--yellow);transition:.2s ease;
    }
    .menu > a:not(.cta):hover:after{width:100%}
    .menu a:hover{color:var(--yellow)}
    .cta{
      background:var(--yellow);color:var(--black)!important;
      padding:13px 18px;font-weight:800;border-radius:12px;
      box-shadow:0 8px 18px rgba(242,196,0,.18);
    }

    .hero{
      min-height:670px;
      background:
        linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.48)),
        repeating-linear-gradient(120deg, #202020 0 1px, #161616 1px 50px);
      color:white;
      display:flex;align-items:center;
      position:relative;overflow:hidden;
    }
    .hero:after{
      content:"";
      position:absolute;right:-70px;bottom:-180px;
      width:600px;height:600px;border:90px solid rgba(242,196,0,.12);
      transform:rotate(18deg);
    }
    .hero-content{position:relative;z-index:1;max-width:850px;padding:90px 0}
    .eyebrow{
      color:var(--yellow);font-size:14px;font-weight:800;letter-spacing:2px;
      text-transform:uppercase;margin-bottom:20px;
    }
    h1{
      font-size:clamp(52px,7vw,94px);
      line-height:.97;
      letter-spacing:-3px;
      max-width:900px;
    }
    .hero p{
      margin-top:28px;font-size:19px;color:#ddd;max-width:640px;
    }
    .hero-actions{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
    .hero-tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
    .hero-tag{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#eee;
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      backdrop-filter:blur(5px);
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:52px;padding:0 22px;font-weight:800;font-size:14px;
      border:1px solid transparent;border-radius:12px;
      transition:.2s ease;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn-yellow{background:var(--yellow);color:var(--black)}
    .btn-dark{border-color:#777;color:#fff;background:transparent}

    section{padding:100px 0}
    .section-head{
      display:flex;justify-content:space-between;gap:30px;align-items:end;
      margin-bottom:50px;
    }
    .section-kicker{color:#8c7100;font-size:13px;font-weight:800;letter-spacing:2px}
    h2{font-size:clamp(36px,4vw,58px);line-height:1.05;margin-top:8px}
    .section-head p{max-width:520px;color:var(--muted)}

    .about-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:72px;align-items:center}
    .about-visual{position:relative;min-height:560px;overflow:hidden;border-radius:28px;background:#111;box-shadow:0 22px 55px rgba(0,0,0,.14)}
    .about-visual::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.78));pointer-events:none}
    .about-visual img{width:100%;height:620px;object-fit:cover;object-position:center;display:block}
    .about-badge{position:absolute;left:24px;bottom:24px;z-index:1;display:flex;align-items:center;gap:15px;padding:16px 20px;background:rgba(17,17,17,.9);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:16px;backdrop-filter:blur(10px)}
    .about-badge strong{color:var(--yellow);font-size:34px;line-height:1}
    .about-badge span{max-width:125px;font-size:13px;font-weight:800;line-height:1.3;text-transform:uppercase;letter-spacing:.7px}
    .about-copy>p{color:var(--muted);margin:20px 0 30px;font-size:17px;line-height:1.75}
    .about-points{border-top:1px solid var(--line)}
    .about-point{display:grid;grid-template-columns:42px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
    .about-point>span{color:#9a7b00;font-size:13px;font-weight:900;padding-top:3px}
    .about-point strong{display:block;color:#111;font-size:17px;margin-bottom:5px}
    .about-point p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
    .about-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px}
    .about-meta div{background:var(--gray);padding:15px 17px;border-radius:14px}
    .about-meta b{display:block;color:#111;font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
    .about-meta span{color:var(--muted);font-size:14px}
    @media(max-width:900px){.about-grid{grid-template-columns:1fr;gap:42px}.about-visual{min-height:480px}.about-visual img{height:540px}}
    @media(max-width:600px){.about-visual{min-height:390px;border-radius:22px}.about-visual img{height:440px}.about-badge{left:16px;bottom:16px;padding:13px 16px}.about-badge strong{font-size:28px}.about-meta{grid-template-columns:1fr}}

    .services{background:var(--gray)}
    .service-list{border-top:1px solid #ccc}
    .service{
      display:grid;grid-template-columns:100px 1fr 1fr;
      gap:25px;align-items:center;
      padding:30px 18px;border-bottom:1px solid #ccc;
      transition:.2s ease;border-radius:16px;
    }
    .service:hover{
      background:#fff;
      transform:translateX(6px);
      box-shadow:0 10px 28px rgba(0,0,0,.05);
    }
    .service-num{font-size:34px;font-weight:900;color:#b48f00}
    .service h3{font-size:28px}
    .service p{color:var(--muted)}

    .work-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .work-card{
      border:1px solid var(--line);
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 14px 35px rgba(0,0,0,.06);
    }
    .work-img{
      height:330px;background:
      linear-gradient(145deg,#1a1a1a,#303030);
      color:#aaa;display:grid;place-items:center;font-weight:700;
    }
    .work-copy{padding:24px}
    .work-copy small{color:#8c7100;font-weight:800}
    .work-copy h3{font-size:25px;margin:8px 0 10px}
    .work-copy p{color:var(--muted)}

    .process{background:var(--black);color:#fff}
    .process .section-head p{color:#bbb}
    .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#333}
    .step{background:#171717;padding:28px;min-height:220px;transition:.2s ease}
    .step:hover{background:#202020}
    .step span{color:var(--yellow);font-size:13px;font-weight:900}
    .step h3{margin:35px 0 12px;font-size:21px}
    .step p{color:#aaa;font-size:14px}

    .contact{
      background:var(--yellow);
    }
    .contact-wrap{
      display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:start;
    }
    .contact h2{color:#111}
    .contact p{max-width:620px;margin-top:18px}
    .contact-box{
      background:#111;color:#fff;padding:34px;
      border-radius:22px;
      box-shadow:0 18px 40px rgba(0,0,0,.15);
    }
    .contact-row{padding:17px 0;border-bottom:1px solid #333}
    .contact-row:last-child{border-bottom:0}
    .contact-row small{display:block;color:#999;margin-bottom:5px}


    .contact-intro{
      max-width:760px;
      margin-bottom:42px;
      font-size:17px;
    }
    .contact-grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:34px;
      align-items:start;
    }
    .form-card{
      background:#fff;
      padding:34px;
      border-radius:22px;
      box-shadow:0 18px 40px rgba(0,0,0,.12);
    }
    .form-card h3,.contact-info h3{
      font-size:24px;
      margin-bottom:22px;
    }
    .form-group{margin-bottom:16px}
    .form-group label{
      display:block;
      font-size:13px;
      font-weight:800;
      margin-bottom:8px;
      color:#333;
    }
    .form-group input,.form-group textarea{
      width:100%;
      border:1px solid #ddd;
      background:#fafafa;
      padding:14px 15px;
      font:inherit;
      border-radius:12px;
      outline:none;
    }
    .form-group input:focus,.form-group textarea:focus{
      border-color:#111;
      background:#fff;
    }
    .form-group textarea{min-height:150px;resize:vertical}
    .form-submit{
      border:0;
      background:#111;
      color:#fff;
      min-height:52px;
      padding:0 22px;
      border-radius:12px;
      font-weight:800;
      cursor:pointer;
    }
    .contact-info{
      background:#111;
      color:#fff;
      padding:34px;
      border-radius:22px;
      box-shadow:0 18px 40px rgba(0,0,0,.15);
    }
    .info-block{
      padding:0 0 24px;
      margin-bottom:24px;
      border-bottom:1px solid #333;
    }
    .info-block:last-child{
      border-bottom:0;
      margin-bottom:0;
      padding-bottom:0;
    }
    .info-block h4{
      color:var(--yellow);
      font-size:16px;
      margin-bottom:12px;
    }
    .info-block p{
      margin:7px 0;
      color:#ddd;
    }
    .info-block strong{color:#fff}

    /* ===== FAQ ===== */

.faq-section{
  background:#f4f4f1;
  padding:100px 0;
}

.faq-heading{
  max-width:760px;
  margin-bottom:42px;
}

.faq-heading h2{
  margin:0 0 16px;
  color:#111;
  font-size:clamp(34px,4vw,52px);
}

.faq-heading p{
  margin:0;
  max-width:620px;
  color:#666;
  font-size:17px;
  line-height:1.7;
}

.faq-list{
  max-width:950px;
}

.faq-item{
  background:#fff;
  border:1px solid #dedede;
  border-radius:16px;
  margin-bottom:14px;
  overflow:hidden;
  transition:border-color .25s ease, box-shadow .25s ease;
}

.faq-item:hover{
  border-color:var(--yellow);
  box-shadow:0 10px 28px rgba(0,0,0,.06);
}

.faq-item[open]{
  border-color:var(--yellow);
}

.faq-item summary{
  position:relative;
  list-style:none;
  cursor:pointer;
  padding:24px 75px 24px 26px;
  color:#111;
  font-size:17px;
  font-weight:800;
  line-height:1.4;
  user-select:none;
}

.faq-item summary::-webkit-details-marker{
  display:none;
}

.faq-item summary::after{
  content:"+";
  position:absolute;
  right:24px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--yellow);
  color:#111;
  border-radius:50%;
  font-size:24px;
  font-weight:500;
  line-height:1;
  transition:transform .25s ease;
}

.faq-item[open] summary::after{
  content:"−";
  transform:translateY(-50%) rotate(180deg);
}

.faq-answer{
  padding:0 75px 24px 26px;
}

.faq-answer p{
  margin:0;
  color:#666;
  line-height:1.75;
  font-size:16px;
}

@media(max-width:700px){
  .faq-section{
    padding:65px 0;
  }

  .faq-heading{
    margin-bottom:30px;
  }

  .faq-heading p{
    font-size:16px;
  }

  .faq-item summary{
    padding:20px 62px 20px 20px;
    font-size:16px;
  }

  .faq-item summary::after{
    right:17px;
    width:32px;
    height:32px;
    font-size:21px;
  }

  .faq-answer{
    padding:0 20px 20px;
  }

  .faq-answer p{
    font-size:15px;
  }
}

    /* Language switcher in the hero */
    .language-switch{display:flex;align-items:center;gap:4px;margin-left:2px;padding-left:12px;border-left:1px solid rgba(255,255,255,.22)}
    .language-switch a{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:34px;padding:0 8px;border:1px solid rgba(255,255,255,.28);border-radius:8px;color:#eee;font-size:11px;font-weight:800;letter-spacing:.04em;transition:.2s ease}
    .language-switch a:hover{border-color:var(--yellow);color:var(--yellow)}

    }

<header>
  <div class="container nav">
    <a class="logo" href="#ana" aria-label="Block Construction">
      <picture><source srcset="/block-construction.webp" type="image/webp"><img src="/block-construction.jpeg.png" alt="Block Construction" width="172" height="75"></picture>
    </a>

    <nav class="menu">
      <a href="#ana">HOME</a>
      <a href="#haqqimizda">ABOUT US</a>

<main>
  <section class="hero" id="ana">
    <div class="container">
      <div class="hero-content">
<div class="eyebrow">BLOCK CONSTRUCTION</div>
        <h1>CONSTRUCTION WORKS</h1>
        <p>
          We carry out agreed construction scopes in line with technical requirements and approved execution plans.
        </p>
        <div class="hero-actions">
          <a class="btn btn-yellow" href="#xidmetler">VIEW SERVICES →</a>
          <a class="btn btn-dark" href="#elaqe">CONTACT →</a>
        </div>
        <div class="hero-tags">
          <span class="hero-tag">Experienced team</span>
          <span class="hero-tag">Quality workmanship</span>
          <span class="hero-tag">Timely delivery</span>
          <span class="hero-tag">Responsible approach</span>
        </div>
      </div>
    </div>
  </section>

  <section id="haqqimizda">
    <div class="container about-grid">
      <div class="about-visual">
        <img src="../haqqimizda.jpg" alt="BLOCK Construction specialists reviewing a construction project" width="640" height="1136" loading="lazy">
        <div class="about-badge"><strong>10</strong><span>Service areas</span></div>
      </div>
      <div class="about-copy">
        <div class="section-kicker">01 / ABOUT US</div>
        <h2>Reliable execution aligned with project requirements.</h2>
        <p>BLOCK Construction delivers construction and finishing works in line with technical requirements, agreed scope and execution plans. We coordinate with contractors and partners to provide responsible delivery across different stages of construction.</p>
        <div class="about-points">
          <div class="about-point"><span>01</span><div><strong>Project-aligned execution</strong><p>Each scope is delivered according to defined technical requirements and the agreed volume of work.</p></div></div>
          <div class="about-point"><span>02</span><div><strong>Broad delivery capability</strong><p>Ten service areas covering foundations, finishing, utility lines, steel structures and waterproofing.</p></div></div>
          <div class="about-point"><span>03</span><div><strong>Coordinated approach</strong><p>Work is organised through clear stages and coordinated with contractors and project partners.</p></div></div>
        </div>
        <div class="about-meta">
          <div><b>Activity</b><span>Construction and finishing execution</span></div>
          <div><b>Coverage</b><span>Azerbaijan</span></div>

<script>
const form = document.getElementById("muraciet-form");
const status = document.getElementById("form-status");

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  status.textContent = "Sending...";

  try {
    const formData = new FormData(form);

    const response = await fetch("/", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams(formData).toString()
    });

    if (!response.ok) {
      throw new Error("Could not send");
    }

    status.textContent = "Your message has been sent.";
    form.reset();
  } catch (error) {
    status.textContent = "Something went wrong. Please try again.";
  }
});
</script>
